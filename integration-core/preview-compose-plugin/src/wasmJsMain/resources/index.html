<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDDS Compose Preview</title>
    <style>
        html, body, #root { width: 100%; height: 100%; margin: 0; }
        body { overflow: hidden; }
    </style>
</head>
<body>
<div id="root"></div>
<script src="preview-compose-plugin.js"></script>
<script>
    async function pluginApi() {
        return await globalThis["preview-compose-plugin"];
    }

    globalThis.submitPreviewPayload = async function (payload) {
        const json = typeof payload === "string" ? payload : JSON.stringify(payload);
        const api = await pluginApi();
        api.submitPreviewPayload(json);
    };

    globalThis.addEventListener("message", function (event) {
        if (event.data && event.data.type === "sdds.preview.payload") {
            globalThis.submitPreviewPayload(event.data.payload);
        }
    });
</script>
</body>
</html>
