<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDDS Compose Preview</title>
    <style>
        html, body, #root {
            width: 100%;
            height: 100%;
            margin: 0;
            background: transparent !important;
        }
        body { overflow: hidden; }
        canvas { background: transparent !important; }
    </style>
</head>
<body>
<div id="root"></div>
<script>
    const pendingRequests = new Map();
    const pendingDescriptions = new Map();
    let describeSequence = 0;
    let runtimeReady = false;
    // Необработанная ошибка в кадре останавливает Compose: дальше плагин не рисует, пока iframe не перезагружен.
    let crashMessage = null;
    // Исключение в кадре Compose не всегда доходит до `error`: рантайм пишет его в console.error. Последняя такая
    // запись объясняет, почему запрос остался без ответа.
    let lastConsoleError = null;
    // Причина остановки для хоста: stack исключения и последняя запись console.error (`details` в failure).
    let crashDetails = null;
    const MAX_DETAILS_LENGTH = 8000;
    const clip = (text) => (text.length > MAX_DETAILS_LENGTH ? text.slice(0, MAX_DETAILS_LENGTH) + "…" : text);
    const originalConsoleError = console.error.bind(console);
    console.error = function (...args) {
        const withStack = args.find((arg) => arg && typeof arg.stack === "string");
        lastConsoleError = {
            message: args.map((arg) => (arg && arg.message) || String(arg)).join(" "),
            stack: withStack ? withStack.stack : undefined,
        };
        originalConsoleError(...args);
    };
    const CRASH_CHECK_DELAY_MS = 3000;

    async function pluginApi() {
        return await globalThis["preview-compose-plugin"];
    }

    function normalizePayload(payload) {
        if (typeof payload === "string") {
            const parsed = JSON.parse(payload);
            return {json: payload, requestId: parsed && parsed.requestId};
        }
        return {json: JSON.stringify(payload), requestId: payload && payload.requestId};
    }

    function submit(payload, destination) {
        // Отказ, найденный до передачи в Kotlin, хост тоже должен получить сообщением, а не только значением promise.
        const refuse = (result) => {
            if (destination) {
                destination.source.postMessage({type: "sdds.preview.result", result}, destination.origin);
            }
            return Promise.resolve(result);
        };
        let normalized;
        try {
            normalized = normalizePayload(payload);
        } catch (error) {
            return refuse({
                type: "failure",
                requestId: "",
                code: "invalid_payload",
                message: error instanceof Error ? error.message : "Preview payload could not be decoded",
            });
        }
        if (typeof normalized.requestId !== "string" || normalized.requestId.length === 0) {
            return refuse({
                type: "failure",
                requestId: "",
                code: "invalid_payload",
                message: "Preview payload must contain a non-empty requestId",
                path: "$.requestId",
            });
        }

        if (crashMessage !== null) {
            return refuse({
                type: "failure",
                requestId: normalized.requestId,
                code: "plugin_crashed",
                message: crashMessage,
                ...(crashDetails ? {details: crashDetails} : {}),
            });
        }

        lastConsoleError = null;
        globalThis.__sddsPreviewCrashCause = undefined;
        // Запрос без ответа и с ошибкой в консоли после отправки считается сбоем: ждать таймаута хоста незачем.
        setTimeout(function () {
            if (pendingRequests.has(normalized.requestId) && lastConsoleError !== null) {
                // Stack искусственного Error из таймера ничего не объясняет: берём stack из записи консоли.
                reportCrash({message: lastConsoleError.message, stack: lastConsoleError.stack});
            }
        }, CRASH_CHECK_DELAY_MS);

        return new Promise(async (resolve) => {
            pendingRequests.set(normalized.requestId, {resolve, destination});
            const api = await pluginApi();
            api.submitPreviewPayload(normalized.json);
        });
    }

    globalThis.submitPreviewPayload = function (payload) {
        return submit(payload, null);
    };

    function describe(componentId, requestId) {
        if (typeof componentId !== "string" || componentId.length === 0) {
            return Promise.resolve({
                type: "failure",
                requestId,
                code: "invalid_request",
                message: "componentId must be a non-empty string",
            });
        }
        if (pendingDescriptions.has(requestId)) {
            return Promise.resolve({
                type: "failure",
                requestId,
                code: "duplicate_request",
                message: `Describe request ${requestId} is already pending`,
            });
        }
        return new Promise(async (resolve) => {
            pendingDescriptions.set(requestId, {resolve});
            try {
                const api = await pluginApi();
                const result = JSON.parse(api.describePreviewComponent(componentId, requestId));
                const pending = pendingDescriptions.get(requestId);
                if (!pending) return;
                pending.resolve(result);
                setTimeout(() => pendingDescriptions.delete(requestId), 0);
            } catch (error) {
                const pending = pendingDescriptions.get(requestId);
                if (!pending) return;
                const result = {
                    type: "failure",
                    requestId,
                    code: "description_failed",
                    message: error instanceof Error ? error.message : String(error),
                };
                pending.resolve(result);
                setTimeout(() => pendingDescriptions.delete(requestId), 0);
            }
        });
    }

    globalThis.describePreviewComponent = function (componentId) {
        return describe(componentId, `describe-${++describeSequence}`);
    };

    globalThis.__sddsPreviewResult = function (resultJson) {
        const result = JSON.parse(resultJson);
        const pending = pendingRequests.get(result.requestId);
        if (!pending) return;
        pendingRequests.delete(result.requestId);
        pending.resolve(result);
        if (pending.destination) {
            pending.destination.source.postMessage(
                {type: "sdds.preview.result", result},
                pending.destination.origin,
            );
        }
    };

    function reportCrash(reason) {
        if (crashMessage !== null) return;
        // Исключение Kotlin/Wasm приходит в JS как `WebAssembly.Exception` без текста и stack: причину отдаёт сам Kotlin
        // (`__sddsPreviewCrashCause`), пока исключение проходит через обёртку над содержимым превью.
        const kotlinCause = globalThis.__sddsPreviewCrashCause;
        const reasonText = reason && reason.message ? reason.message : kotlinCause ? kotlinCause.message : String(reason);
        crashMessage = "Compose preview stopped: " + reasonText;
        const details = {};
        const stack = reason && typeof reason.stack === "string" ? reason.stack
            : kotlinCause ? kotlinCause.stack
            : lastConsoleError && lastConsoleError.stack;
        if (stack) details.stack = clip(stack);
        const consoleError = kotlinCause ? kotlinCause.message : lastConsoleError && lastConsoleError.message;
        if (consoleError) details.consoleError = clip(consoleError);
        crashDetails = Object.keys(details).length > 0 ? details : null;
        for (const [requestId, pending] of [...pendingRequests]) {
            pendingRequests.delete(requestId);
            const result = {
                type: "failure",
                requestId,
                code: "render_crashed",
                message: crashMessage,
                ...(crashDetails ? {details: crashDetails} : {}),
            };
            pending.resolve(result);
            if (pending.destination) {
                pending.destination.source.postMessage(
                    {type: "sdds.preview.result", result},
                    pending.destination.origin,
                );
            }
        }
    }

    globalThis.addEventListener("error", function (event) {
        reportCrash(event.error || event.message);
    });
    globalThis.addEventListener("unhandledrejection", function (event) {
        reportCrash(event.reason);
    });

    globalThis.__sddsPreviewReady = function (protocolVersion) {
        if (runtimeReady) return;
        runtimeReady = true;
        if (globalThis.parent !== globalThis) {
            globalThis.parent.postMessage(
                {type: "sdds.preview.ready", protocolVersion},
                "*",
            );
        }
    };

    globalThis.addEventListener("message", async function (event) {
        const envelope = event.data;
        if (!envelope) return;
        if (!event.source || typeof event.origin !== "string") return;
        if (envelope.type === "sdds.preview.describe") {
            if (typeof envelope.requestId !== "string" || envelope.requestId.length === 0) return;
            const result = await describe(envelope.componentId, envelope.requestId);
            event.source.postMessage(
                {type: "sdds.preview.description", result},
                event.origin,
            );
            return;
        }
        if (envelope.type !== "sdds.preview.payload") return;
        const payload = envelope.payload;
        if (!payload || (typeof payload !== "object" && typeof payload !== "string")) return;
        let requestId;
        try {
            requestId = typeof payload === "string" ? JSON.parse(payload).requestId : payload.requestId;
        } catch (_) {
            return;
        }
        if (typeof requestId !== "string" || requestId.length === 0) return;

        await submit(payload, {source: event.source, origin: event.origin});
    });
</script>
<script src="preview-compose-plugin.js"></script>
</body>
</html>
